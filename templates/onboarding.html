<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fitness Coach - Profile Setup</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e1e5e9;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .checkbox-item input[type="checkbox"] {
            width: auto;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        button:hover {
            background: #5a6fd8;
        }
        .error {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 1rem;
        }
        .success {
            color: #27ae60;
            text-align: center;
            margin-bottom: 1rem;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e1e5e9;
            border-radius: 2px;
            margin-bottom: 2rem;
        }
        .progress-fill {
            height: 100%;
            background: #667eea;
            border-radius: 2px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Complete Your Profile</h1>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
        </div>
        
        <div id="onboarding-error" class="error" style="display: none;"></div>
        
        <form id="onboarding-form">
            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" min="13" max="100" required>
            </div>
            
            <div class="form-group">
                <label for="experience">Fitness Experience Level:</label>
                <select id="experience" required>
                    <option value="">Select your experience level</option>
                    <option value="beginner">Beginner (0-6 months)</option>
                    <option value="intermediate">Intermediate (6 months - 2 years)</option>
                    <option value="advanced">Advanced (2+ years)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Primary Goals (select all that apply):</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="goal-strength" value="strength">
                        <label for="goal-strength">Strength</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="goal-hypertrophy" value="hypertrophy">
                        <label for="goal-hypertrophy">Muscle Building</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="goal-endurance" value="endurance">
                        <label for="goal-endurance">Endurance</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="goal-flexibility" value="flexibility">
                        <label for="goal-flexibility">Flexibility</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="goal-weight-loss" value="weight_loss">
                        <label for="goal-weight-loss">Weight Loss</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="goal-mobility" value="mobility">
                        <label for="goal-mobility">Mobility</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="time-available">Time Available per Session (minutes):</label>
                <select id="time-available" required>
                    <option value="">Select time available</option>
                    <option value="15">15 minutes</option>
                    <option value="30">30 minutes</option>
                    <option value="45">45 minutes</option>
                    <option value="60">60 minutes</option>
                    <option value="90">90 minutes</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Equipment Available:</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="equipment-none" value="none">
                        <label for="equipment-none">None (Bodyweight only)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="equipment-dumbbells" value="dumbbells">
                        <label for="equipment-dumbbells">Dumbbells</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="equipment-barbell" value="barbell">
                        <label for="equipment-barbell">Barbell</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="equipment-kettlebells" value="kettlebells">
                        <label for="equipment-kettlebells">Kettlebells</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="equipment-resistance-bands" value="resistance_bands">
                        <label for="equipment-resistance-bands">Resistance Bands</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="equipment-pull-up-bar" value="pull_up_bar">
                        <label for="equipment-pull-up-bar">Pull-up Bar</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label>Injuries or Limitations:</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="injury-knee" value="knee">
                        <label for="injury-knee">Knee Issues</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="injury-shoulder" value="shoulder">
                        <label for="injury-shoulder">Shoulder Issues</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="injury-back" value="back">
                        <label for="injury-back">Back Issues</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="injury-wrist" value="wrist">
                        <label for="injury-wrist">Wrist Issues</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="injury-ankle" value="ankle">
                        <label for="injury-ankle">Ankle Issues</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="injury-none" value="none">
                        <label for="injury-none">None</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="specific-goals">Specific Goals or Preferences:</label>
                <textarea id="specific-goals" rows="3" placeholder="Tell us about your specific fitness goals, preferences, or any other information that would help us create better workouts for you..."></textarea>
            </div>
            
            <button type="submit">Complete Profile</button>
        </form>
    </div>

    <script>
        function updateProgress() {
            const form = document.getElementById('onboarding-form');
            const inputs = form.querySelectorAll('input, select, textarea');
            const filledInputs = Array.from(inputs).filter(input => {
                if (input.type === 'checkbox') {
                    return input.checked;
                }
                return input.value.trim() !== '';
            });
            
            const progress = (filledInputs.length / inputs.length) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
        }

        // Add event listeners to all form inputs
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('onboarding-form');
            const inputs = form.querySelectorAll('input, select, textarea');
            
            inputs.forEach(input => {
                input.addEventListener('input', updateProgress);
                input.addEventListener('change', updateProgress);
            });
            
            updateProgress();
        });

        document.getElementById('onboarding-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Collect form data
            const formData = {
                age: parseInt(document.getElementById('age').value),
                experience: document.getElementById('experience').value,
                goals: Array.from(document.querySelectorAll('input[type="checkbox"][id^="goal-"]:checked')).map(cb => cb.value),
                timeAvailable: document.getElementById('time-available').value,
                equipment: Array.from(document.querySelectorAll('input[type="checkbox"][id^="equipment-"]:checked')).map(cb => cb.value),
                limitations: Array.from(document.querySelectorAll('input[type="checkbox"][id^="injury-"]:checked')).map(cb => cb.value),
                specificGoals: document.getElementById('specific-goals').value
            };
            
            // Validate required fields
            if (!formData.age || !formData.experience || formData.goals.length === 0 || !formData.timeAvailable) {
                showError('Please fill in all required fields');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/complete-profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                console.log('Profile completion response:', data);
                
                if (data.status === 'success') {
                    // Use the redirect URL provided by the backend
                    const redirectUrl = data.redirect_url || '/chat';
                    console.log('Redirecting to:', redirectUrl);
                    
                    // Wait a moment for session to be fully saved, then redirect
                    setTimeout(() => {
                        console.log('Performing redirect via replace...');
                        window.location.replace(redirectUrl);
                    }, 500);
                } else {
                    showError(data.message || 'Failed to save profile');
                }
            } catch (error) {
                showError('Network error. Please try again.');
            }
        });

        function showError(message) {
            const errorElement = document.getElementById('onboarding-error');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
    </script>
</body>
</html>
